name = "odyssey-creator-pages"
main = "src/worker.js"
compatibility_date = "2026-11-01"
# Keep variables set in the Cloudflare dashboard (FORM_URL, FORM_REF_ENTRY,
# VIDEO_URL) when deploying. ADMIN_PASSWORD is a secret and always kept.
keep_vars = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Creator records and photos. No id needed: Cloudflare creates the KV store
# on first deploy and reuses it after that.
[[kv_namespaces]]
binding = "CREATORS"
